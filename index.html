<style>
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(vendor/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(vendor/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:800;font-display:swap;src:url(vendor/inter-latin-800-normal.woff2) format("woff2")}
/* Warm paper, ink stat cards, orange for "do this", green for "done" (Today mockup v2, rated 8+). */
:root{
  --bg:#f6f1e7; --card:#fffdf8; --sunk:#efe8db; --line:#ece4d6;
  --ink:#1d1a16; --ink2:#4d463d; --mute:#857d71; --faint:#b3aa9c;
  --acc:#e2531f; --acc-ink:#fff; --acc-soft:#fde3d6; --acc-text:#b8400f;
  --ok:#2f7d4f; --ok-soft:#dcefe2;
  --gold:#a86400; --gold-soft:#fbefd9; --warn:#b3261e; --warn-soft:#fbe9e7;
  --bar:#8b8173; --cal:#f2b33d; --water:#3b8fd9;
  --h0:#efe8db; --h1:#cfe6d9; --h2:#94cbad; --h3:#3f9b6f; --h4:#2f7d4f;
  --shadow:none;
  --r:24px; --gut:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15130f; --card:#1f1c17; --sunk:#2a2620; --line:#2e2a23;
  --ink:#f5efe4; --ink2:#cfc6b8; --mute:#9a9183; --faint:#6b6358;
  --acc:#ff7a45; --acc-ink:#1d0d05; --acc-soft:#3a2216; --acc-text:#ff9a6e;
  --ok:#5fc78a; --ok-soft:#173326;
  --gold:#f0b44c; --gold-soft:#33270f; --warn:#ff8a80; --warn-soft:#3a1b19;
  --bar:#8d8476; --cal:#f2b33d; --water:#5aa9ec;
  --h0:#2a2620; --h1:#1d3a2b; --h2:#22633f; --h3:#2f9a63; --h4:#5fc78a;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#15130f; --card:#1f1c17; --sunk:#2a2620; --line:#2e2a23;
  --ink:#f5efe4; --ink2:#cfc6b8; --mute:#9a9183; --faint:#6b6358;
  --acc:#ff7a45; --acc-ink:#1d0d05; --acc-soft:#3a2216; --acc-text:#ff9a6e;
  --ok:#5fc78a; --ok-soft:#173326;
  --gold:#f0b44c; --gold-soft:#33270f; --warn:#ff8a80; --warn-soft:#3a1b19;
  --bar:#8d8476; --cal:#f2b33d; --water:#5aa9ec;
  --h0:#2a2620; --h1:#1d3a2b; --h2:#22633f; --h3:#2f9a63; --h4:#5fc78a;
  --shadow:none;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);overscroll-behavior-y:none}
body{background:var(--bg);color:var(--ink);font:400 15px/1.4 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;caret-color:var(--acc)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;text-align:left}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:430px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1{font-size:30px;font-weight:800;letter-spacing:-.025em;margin:4px 0 14px}
h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:26px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-size:13px;color:var(--mute);font-weight:600;letter-spacing:0}
.sub{color:var(--mute);font-size:13px;font-weight:600}
.head{display:flex;align-items:flex-end;justify-content:space-between}
.gear{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--mute);margin-bottom:8px}
.card{background:var(--card);border-radius:24px;padding:18px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{background:#f5efe4;color:#1d1a16;border-radius:24px;padding:16px}
.big .l{font-size:13px;font-weight:600;opacity:.65}
.big .top{display:flex;align-items:center;gap:6px}.big .top .ic{width:16px;height:16px}
.big b{display:block;font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.big .of{font-size:13px;opacity:.65}
.meter{height:8px;border-radius:99px;background:rgba(0,0,0,.14);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:#1d1a16;transition:width .15s}
.big .left{display:block;font-size:12px;font-weight:700;margin-top:8px;opacity:.7}
.big.hit .meter i{background:#2f7d4f}.big.hit .left{color:#2f7d4f;opacity:1}
.big.over .meter i{background:#b3261e}.big.over .left{color:#b3261e;opacity:1}
.wt{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:18px;padding:8px 10px 8px 16px;margin-bottom:10px}
.wt .sub{display:flex;align-items:center;gap:6px}
.wt .wv{display:flex;align-items:center;gap:2px}
.wt input{width:70px;border:0;background:none;color:var(--ink);font:800 20px Inter,system-ui;text-align:center;font-variant-numeric:tabular-nums;padding:0}
.wt .u{font-weight:700;color:var(--mute);margin:0 2px}
.wt .sb{width:36px;height:36px;border-radius:11px;background:var(--sunk);font-size:18px;font-weight:700;display:grid;place-items:center}
.chip{flex:none;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:14px;padding:9px 12px;font:600 13px Inter,system-ui;cursor:pointer;text-align:left}
.chip small{display:block;color:var(--mute);font-weight:600;font-size:12px}
.chip.ic-l,.btn.ic-l{display:inline-flex;align-items:center;gap:6px}
.okdot{width:34px;height:34px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;flex:none}.okdot .ic{width:18px;height:18px;stroke-width:3}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sunk);border-radius:16px;padding:4px}
.seg button{background:none;color:var(--mute);font:600 14px Inter,system-ui;padding:9px 0;border-radius:12px;text-align:center}
.seg button.on{background:var(--card);color:var(--ink)}
.seg button small{display:block;font-size:11px;font-weight:600;opacity:.8;margin-top:1px}
.seg .ic{display:block;margin:0 auto 3px;width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;margin:0 -2px;scrollbar-width:none}
.chip.dish{max-width:230px}.chip.dish b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl{margin-top:16px}
.sl .r{display:flex;justify-content:space-between;align-items:baseline}
.sl .r span{font-size:14px;font-weight:600;color:var(--ink2)}
.sl .r b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.sl .r b em{font-style:normal;font-size:14px;color:var(--mute);font-weight:600;margin-left:3px}
input[type=range]{width:100%;height:44px;-webkit-appearance:none;appearance:none;background:none;margin-top:2px}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:var(--sunk)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:var(--acc);margin-top:-11px;border:3px solid var(--card)}
input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:var(--sunk)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--acc);border:3px solid var(--card)}
.rows .row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.rows .row:first-child{border-top:0}.rows .row span{color:var(--mute)}.rows .row b{font-variant-numeric:tabular-nums}
.why2{font-size:13px;color:var(--ink2);margin:10px 4px 0;line-height:1.4}.why2 b{color:var(--ink)}
.start{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:24px;padding:16px 18px}
.start b{font-size:18px;font-weight:800;display:block}
.btn{border:0;background:var(--acc);color:var(--acc-ink);font:800 15px Inter,system-ui;padding:12px 20px;border-radius:14px;cursor:pointer;text-align:center;justify-content:center}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.step button:active,.tick:active,.chip:active,.btn:active,.wt .sb:active{transform:scale(.94)}
.seg3{display:flex;background:var(--sunk);border-radius:12px;padding:3px}.seg3 button{padding:8px 12px;border-radius:10px;font-weight:700;font-size:13px;color:var(--mute)}.seg3 button.on{background:var(--card);color:var(--ink)}
.prog{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 12px;margin-top:-6px}.prog .sub{display:flex;justify-content:space-between;margin-bottom:6px}
.prog .bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}.prog .bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .2s}
.ex{background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:8px}
.ex.done{background:var(--ok-soft)}
.ex .n{font-weight:700;font-size:16px}
.ex .why{font-size:12px;color:var(--mute);margin:2px 0 4px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;background:var(--sunk);color:var(--ink2);margin-left:8px;vertical-align:2px}.pill .ic{width:12px;height:12px}
.pill.heavy{background:var(--acc-soft);color:var(--acc-text)}
.set{display:flex;align-items:center;gap:6px;padding:6px 0 0;border-top:1px solid var(--line);margin-top:6px}
.set .sn{width:24px;height:24px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mute);flex:none}
.set.sd .sn{background:var(--ok-soft);color:var(--ok)}
.step{display:flex;align-items:center;gap:4px}
.step button{width:34px;height:34px;border-radius:10px;background:var(--sunk);color:var(--ink);font:700 16px Inter;position:relative;display:grid;place-items:center}
.step button:after{content:"";position:absolute;inset:-5px -2px}
.step div{min-width:38px;text-align:center;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;line-height:1.1}
.step div small{display:block;font-size:11px;color:var(--mute);font-weight:600}
.tick{margin-left:auto;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);color:transparent;display:grid;place-items:center;flex:none}
.tick .ic{width:20px;height:20px;stroke-width:3}
.set.sd .tick{background:var(--ok);border-color:var(--ok);color:#0c1d13}
.hero{background:#f5efe4;color:#1d1a16;border-radius:24px;padding:18px}
.hero .l{font-size:13px;font-weight:600;opacity:.65}
.hero b{display:block;font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:2px 0}
.hero .s{font-size:14px;opacity:.75;display:block}
.hero .tr{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;background:rgba(47,125,79,.14);color:#2f7d4f;border-radius:99px;padding:3px 10px;margin:4px 0 6px}.hero .tr .ic{width:14px;height:14px}
.hero svg.ch{display:block;width:100%;height:auto;margin-top:10px}
.wins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.win{background:var(--card);border-radius:20px;padding:14px}
.win .ic{width:18px;height:18px;color:var(--acc);margin-bottom:6px;display:block}
.win b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.win b em{font-style:normal;font-size:15px;color:var(--mute);font-weight:600}
.win span{font-size:13px;color:var(--mute);font-weight:600}
.dots{display:flex;gap:4px;margin-top:8px}.dots i{flex:1;height:8px;border-radius:99px;background:var(--sunk)}.dots i.on{background:var(--ok)}
.week{display:grid;grid-template-columns:auto repeat(6,1fr);gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.week i{height:26px;border-radius:8px;background:var(--sunk)}.week i.ok{background:var(--ok)}.week i.part{background:color-mix(in srgb,var(--ok) 40%,var(--sunk))}.week .h{text-align:center}.week .h.td{color:var(--acc);font-weight:800}
.lifts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lift{background:var(--card);border-radius:20px;padding:14px}
.lift .n{font-size:13px;font-weight:600;color:var(--mute)}
.lift b{display:block;font-size:24px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.lift .d{font-size:12px;font-weight:700;color:var(--ok);min-height:15px}
.lift svg{display:block;width:100%;height:34px;margin-top:6px}
.legend{font-size:12px;color:var(--mute);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.ax{font-size:10px;fill:var(--mute)}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.chartbox svg{width:100%;display:block}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(10px + env(safe-area-inset-bottom))}
nav div{display:flex;width:100%;max-width:430px}
nav button{flex:1;color:var(--mute);font:600 12px Inter,system-ui;padding:8px 0;text-align:center}
nav button.on{color:var(--acc)}
nav .pi{display:grid;place-items:center;width:56px;height:30px;margin:0 auto 3px;border-radius:99px;transition:background .15s}
nav button.on .pi{background:var(--acc-soft)}
nav .pi .ic{width:24px;height:24px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.savewarn{position:fixed;top:0;left:0;right:0;background:#b3261e;color:#fff;padding:8px 16px;font-size:13px;font-weight:600;z-index:30;text-align:center}
.backbtn{display:flex;align-items:center;gap:4px;color:var(--mute);font-weight:700;height:44px}
.list{padding:4px 18px}
.cell{display:flex;align-items:center;gap:10px;width:100%;padding:14px 0;border-top:1px solid var(--line);color:var(--ink)}
.list>.cell:first-child,form.list>.cell:first-child{border-top:0}
.cell .grow,.grow{flex:1;min-width:0}.cell b{display:block;font-size:15px}.cell span.d{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.cell.col{flex-direction:column;align-items:stretch}.cell .row{display:flex;gap:8px}
.cell.danger b{color:var(--warn)}
.inp{width:96px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:12px;padding:10px;font:700 16px Inter,system-ui;text-align:right}
.inp.date,.inp.grow{width:auto;text-align:left}
.unit{color:var(--mute);font-size:13px;font-weight:600;width:36px}
.foot{font-size:12px;color:var(--mute);margin:12px 4px}
/* Phone fit: the weight row wraps instead of widening the page; gym rows drop the set number under 375px so the tick stays on screen. Ticks and weight buttons are 44px for a sweaty thumb, with a visible ring. */
.wt{flex-wrap:wrap;row-gap:8px}
.wt .sb,.tick{width:44px;height:44px}
.tick{border-color:var(--mute)}
input[type=range]{touch-action:pan-y}
@media (max-width:374px){.set .sn{display:none}.set{gap:4px}.step{gap:2px}.ex{padding:14px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
