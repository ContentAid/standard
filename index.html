<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Standard">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101112" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Standard</title>
<style>
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(vendor/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(vendor/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:800;font-display:swap;src:url(vendor/inter-latin-800-normal.woff2) format("woff2")}
/* Quiet, standard phone app: warm paper, white grouped lists, one green for "do this" and "done". */
:root{
  --bg:#f4f3ef; --card:#fff; --sunk:#ecebe6; --line:#e4e2dc;
  --ink:#16181b; --ink2:#4a4e55; --mute:#6c7078; --faint:#a4a7ad;
  --acc:#17734f; --acc-ink:#fff; --acc-soft:#e1f0e8; --acc-text:#0f5c3e;
  --gold:#a86400; --gold-soft:#fbefd9; --warn:#b3261e; --warn-soft:#fbe9e7;
  --bar:#8b9097; --cal:#5b6b8c;
  --h0:#ecebe6; --h1:#cfe6d9; --h2:#94cbad; --h3:#3f9b6f; --h4:#17734f;
  --shadow:0 1px 2px rgba(22,24,27,.05),0 2px 8px rgba(22,24,27,.04);
  --r:16px; --gut:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101112; --card:#1b1c1e; --sunk:#25272a; --line:#2b2d31;
  --ink:#f1f1ee; --ink2:#c5c7cb; --mute:#9a9ea6; --faint:#62666d;
  --acc:#3fbf85; --acc-ink:#05140d; --acc-soft:#16301f; --acc-text:#6fd6a4;
  --gold:#f0b44c; --gold-soft:#33270f; --warn:#ff8a80; --warn-soft:#3a1b19;
  --bar:#7d828a; --cal:#8fa1c7;
  --h0:#25272a; --h1:#1d3a2b; --h2:#22633f; --h3:#2f9a63; --h4:#4fd193;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#101112; --card:#1b1c1e; --sunk:#25272a; --line:#2b2d31;
  --ink:#f1f1ee; --ink2:#c5c7cb; --mute:#9a9ea6; --faint:#62666d;
  --acc:#3fbf85; --acc-ink:#05140d; --acc-soft:#16301f; --acc-text:#6fd6a4;
  --gold:#f0b44c; --gold-soft:#33270f; --warn:#ff8a80; --warn-soft:#3a1b19;
  --bar:#7d828a; --cal:#8fa1c7;
  --h0:#25272a; --h1:#1d3a2b; --h2:#22633f; --h3:#2f9a63; --h4:#4fd193;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom));caret-color:var(--acc)}
body.lock{overflow:hidden}
::selection{background:var(--acc-soft);color:var(--ink)}
button,a{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-decoration:none;text-align:left}
button:disabled{opacity:.35;cursor:default}
input{font:inherit;color:var(--ink)}
input::placeholder{color:var(--faint)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:6px}
.center{text-align:center;justify-content:center}
.muted{color:var(--mute)}
.small{font-size:13px}
.pos{color:var(--acc-text)}

.wrap{max-width:560px;margin:0 auto;padding:0 var(--gut)}
.title{display:flex;align-items:flex-end;gap:12px;padding:22px 0 16px}
.title h1{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.title p{color:var(--mute);font-size:14px;margin-top:3px}
.backbtn{display:inline-flex;align-items:center;gap:2px;color:var(--acc-text);font-weight:600;padding:16px 0 0;min-height:44px}
.iconbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;color:var(--ink2)}
.streak{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:14px;color:var(--gold);background:var(--gold-soft);padding:5px 10px 5px 8px;border-radius:20px}

/* section heads */
.sh{font-size:13px;font-weight:600;color:var(--mute);padding:26px 4px 8px}
.sh small{font-weight:400;color:var(--faint)}
.shrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.shrow .tag{margin-bottom:8px}
.foot{font-size:13px;color:var(--mute);padding:8px 4px 0}
.note{font-size:13.5px;color:var(--ink2);background:var(--gold-soft);border-radius:12px;padding:10px 12px;margin:10px 0}

/* cards and grouped lists */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.card + .card{margin-top:10px}
.pad{padding:16px}
.list{overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 16px;position:relative}
.cell + .cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.cell.col{flex-direction:column;align-items:stretch;gap:10px;padding:14px 16px}
.cell b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.cell .grow > span,.cell.col > div > span{display:block;font-size:13px;color:var(--mute);margin-top:2px;line-height:1.35}
button.cell:active{background:var(--sunk)}
.cell .i:last-child{color:var(--faint)}
.cell.danger b{color:var(--warn)}
.val{text-align:right;font-weight:600;white-space:nowrap;display:inline-flex;flex-direction:column;align-items:flex-end}
.val small{font-weight:400;font-size:12px;color:var(--mute)}
.val small.pos{color:var(--acc-text)}
.val.pos{flex-direction:row;align-items:center;gap:2px;color:var(--acc-text)}
.unit{color:var(--mute);font-size:14px;width:56px}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.tag.good{background:var(--acc-soft);color:var(--acc-text)}
.tag.gold{background:var(--gold-soft);color:var(--gold)}
.backup{margin-top:10px}
.empty{padding:28px 16px;text-align:center}
.empty b{display:block;font-size:17px}.empty span{color:var(--mute);font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:12px;background:var(--sunk);font-weight:600;font-size:14.5px;white-space:nowrap;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc);color:var(--acc-ink)}
.btn.wide{display:flex;width:100%;min-height:50px;margin-top:12px}
.btn.big{min-height:56px;font-size:16.5px;border-radius:14px}
.link{display:inline-flex;align-items:center;gap:4px;color:var(--acc-text);font-weight:600;font-size:14.5px;min-height:44px}
.link.center{display:flex;width:100%}
.inp{width:76px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;text-align:right;font-size:15px}
.inp:focus{outline:none;border-color:var(--acc)}

/* segmented control */
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:2px;margin-bottom:8px}
.seg button{font-size:13px;font-weight:600;padding:6px 12px;border-radius:8px;color:var(--mute);min-height:32px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.wide{display:flex;margin:0 0 4px}.seg.wide button{flex:1;text-align:center;min-height:36px}

/* progress bars */
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ink2);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.bar.good i{background:var(--acc)}
.bar.cal i{background:var(--cal)}
.bar.tall{height:12px;border-radius:6px;overflow:visible}
.bar.tall i{border-radius:6px;background:var(--ink2)}
.bar.tall.good i{background:var(--acc)}
.bar.tall em{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}

/* Today summary */
.summary{padding:6px 16px}
.sumrow{display:grid;grid-template-columns:1fr auto;align-items:baseline;row-gap:8px;padding:12px 0;width:100%}
.sumrow + .sumrow{border-top:1px solid var(--line)}
.sumrow .bar{grid-column:1/-1}
.sl{font-size:13px;font-weight:600;color:var(--mute)}
.sv{font-size:15px;color:var(--mute)}
.sv b{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.01em}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 12px;border-radius:12px;background:var(--sunk);font-size:14px;font-weight:600;line-height:1.25}
.chip em{font-style:normal;font-weight:400;color:var(--mute);font-size:13px;white-space:nowrap}
.chip:active{background:var(--acc-soft)}

/* habits */
.habit .tick,.pick .radio{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);flex:none;color:var(--acc-ink);transition:background .15s,border-color .15s}
.habit.on .tick,.pick.on .radio{background:var(--acc);border-color:var(--acc)}
.habit.on b{color:var(--ink)}
.pick .radio{width:22px;height:22px}
.pick.on{background:color-mix(in srgb,var(--acc-soft) 55%,transparent)}

/* Train */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.week button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 7px;border-radius:12px;font-size:13px;font-weight:600;color:var(--mute);min-height:52px;text-align:center}
.week button i{width:6px;height:6px;border-radius:50%;background:transparent}
.week button.done i{background:var(--acc)}
.week button.td span{color:var(--acc-text)}
.week button.sel{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.workout{padding:18px 16px 16px;margin-top:6px}
.wtop{display:flex;align-items:flex-start;gap:12px}
.wtop h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.wtop p{color:var(--mute);font-size:14px;margin-top:2px}
.meta{font-size:13px;color:var(--mute);text-align:right;line-height:1.45}

/* exercise detail */
.tcard{padding:16px}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.trow > div{display:flex;flex-direction:column;gap:2px}
.trow .big{font-size:26px;font-weight:800;letter-spacing:-.02em}
.trow span.num{font-size:13px;color:var(--mute)}
.why{font-size:14px;color:var(--ink2);margin-top:12px;line-height:1.45}
.why.up{color:var(--acc-text);font-weight:600}
.cue{font-size:14px;color:var(--ink2);margin-top:8px}

/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.readout{font-size:14px;margin-bottom:10px;min-height:20px}
.readout b{font-weight:700}
.grid{stroke:var(--line);stroke-width:1}
.ax{fill:var(--mute);font-size:10.5px;font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.ax.strong{fill:var(--ink);font-weight:600}
.hit{cursor:pointer}
.bm{fill:var(--bar)}
.bm.met{fill:var(--acc)}
.bm.sel{stroke:var(--ink);stroke-width:2}
.target{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}
.ln{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ln.faint{stroke:var(--faint);stroke-width:1.5}
.cross{stroke:var(--faint);stroke-width:1}
.dot{fill:var(--acc);stroke:var(--card);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 6px;font-size:12px;color:var(--mute);margin-top:10px}
.legend i{display:inline-block;flex:none}
.legend i:not(:first-child){margin-left:8px}
.legend .sw{width:10px;height:10px;border-radius:3px;background:var(--bar)}
.legend .sw.met{background:var(--acc)}
.legend .dash{width:16px;border-top:1.5px dashed var(--ink)}
.legend .ln2{width:16px;border-top:2px solid var(--acc)}
.legend .ln2.faint{border-top:1.5px solid var(--faint)}
.legend .tickm{width:2px;height:12px;background:var(--ink)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);padding:16px 4px}
.stats3 > div{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.stats3 > div + div{border-left:1px solid var(--line)}
.stats3 b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.stats3 b small{font-size:14px;font-weight:600;color:var(--mute)}
.stats3 span{font-size:12.5px;color:var(--mute)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}
.heat button{aspect-ratio:1;border-radius:3px;background:var(--h0);min-width:0}
.heat .l1{background:var(--h1)}.heat .l2{background:var(--h2)}.heat .l3{background:var(--h3)}.heat .l4{background:var(--h4)}
.heat .lf{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.heat .td{outline:2px solid var(--ink);outline-offset:1px}
.hl{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--h0)}
.hl.l1{background:var(--h1)}.hl.l2{background:var(--h2)}.hl.l3{background:var(--h3)}.hl.l4{background:var(--h4)}
.mbar{display:grid;grid-template-columns:84px 1fr 44px;align-items:center;gap:10px;padding:5px 0;font-size:13.5px}
.mname{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtrack{position:relative;height:10px;background:var(--sunk);border-radius:5px}
.mtrack i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:5px;transition:width .4s}
.mtrack em{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.mval{text-align:right;font-weight:600}.mval small{color:var(--mute);font-weight:400}

/* Food */
.macros .mrow{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px}
.macros .mrow:first-child{margin-top:0}
.macros .mrow b{font-size:20px;font-weight:800}
.macros .mrow .num{color:var(--mute)}
.hint{font-size:12.5px;color:var(--mute);margin:8px 0}
.glasses{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.glasses button{display:grid;place-items:center;height:40px;border-radius:10px;background:var(--sunk);color:var(--faint)}
.glasses button.on{background:color-mix(in srgb,var(--cal) 22%,var(--card));color:var(--cal)}
.glasses button.on .i{fill:currentColor}
.search{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:15px;margin-bottom:6px}
.search:focus{outline:none;border-color:var(--acc)}
.custom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.custom input{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
.custom input:first-child{grid-column:1/-1}
.custom .btn{grid-column:1/-1;min-height:46px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--sunk)}
.qty b{min-width:28px;text-align:center}

/* Gym: full-screen session */
.gym{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding:env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom))}
.gbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:6px 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.gbar b{display:block;font-size:15px}
.gbar .center span{display:block;font-size:12px;color:var(--mute)}
.gbar .link{padding:0 8px}
.exstrip{display:flex;gap:4px;padding:2px var(--gut) 0;max-width:560px;margin:0 auto}
.exstrip button{flex:1;padding:8px 0;min-height:24px}
.exstrip i{display:block;height:4px;border-radius:2px;background:var(--line)}
.exstrip .done i{background:var(--acc)}
.exstrip .on i{background:var(--ink)}
.gbody{max-width:560px;margin:0 auto;padding:12px var(--gut) 0}
.gh{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.15;text-wrap:balance;margin-top:8px}
.gbody > .muted{font-size:14px;margin:4px 0 0}
.gbody > .card,.gbody > .sets{margin-top:16px}
.sets{padding:4px 0}
.shead,.srow{display:grid;grid-template-columns:40px 1fr 1fr 34px;align-items:center;gap:6px;padding:0 14px}
.shead{font-size:12px;font-weight:600;color:var(--mute);height:34px}
.srow{width:100%;min-height:46px;font-size:15px;border-radius:10px}
.srow:disabled{opacity:1;color:var(--faint)}
.srow.cur{background:var(--acc-soft);font-weight:600;color:var(--acc-text)}
.srow.done{color:var(--ink)}
.srow .st{display:grid;place-items:center;color:var(--acc-text);font-size:11px;font-weight:800}
.srow.pr .st{color:var(--gold)}
.srowbtns{display:flex;justify-content:space-between;padding:0 14px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stepper{background:var(--card);border-radius:var(--r);padding:12px 10px 10px;box-shadow:var(--shadow)}
.stepper .sl{display:block;text-align:center;margin-bottom:8px}
.sctl{display:flex;align-items:center;gap:4px}
.sctl button{display:grid;place-items:center;width:44px;height:52px;border-radius:12px;background:var(--sunk);flex:none}
.sctl button:active{background:var(--acc-soft)}
.sctl input{width:100%;min-width:0;height:52px;border:0;background:transparent;text-align:center;font-size:28px;font-weight:800;letter-spacing:-.02em}
.sctl input:focus{outline:none;background:var(--sunk);border-radius:10px}
.exdone{margin-top:6px}
.restbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:70;max-width:540px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:12px 12px 12px 18px;border-radius:18px;background:var(--ink);color:var(--bg);overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.22)}
.restbar .rfill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--acc) 35%,transparent);transition:width .25s linear}
.restbar > *{position:relative}
.restbar b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.restbar span{font-size:13px;opacity:.75}
.restbar .btn{background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg);min-height:44px;padding:0 12px}
.restbar.go{background:var(--acc);color:var(--acc-ink)}
.restbar.go .btn{background:rgba(0,0,0,.14);color:var(--acc-ink)}

/* tab bar, toast */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:4px 0 calc(4px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:560px;margin:0 auto;display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--faint);padding:6px 0;min-height:54px}
.tabbar button.on{color:var(--acc-text)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,10px);z-index:100;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1);max-width:calc(100vw - 32px);text-align:center}
body.lock .toast{bottom:calc(112px + env(safe-area-inset-bottom))}
.toast.show{opacity:1;transform:translate(-50%,0)}
.savewarn{position:fixed;top:0;left:0;right:0;z-index:120;background:var(--warn);color:#fff;font-size:13px;font-weight:600;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;text-align:center}

/* settings switch */
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:var(--acc)}
.switch:checked::after{transform:translateX(20px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
